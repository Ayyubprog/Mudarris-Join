name: Deploy MUDARRIS JOIN to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - "public/**"
      - "functions/**"
      - "cloudflare-worker/**"
      - "scripts/**"
      - "migrations/**"
      - "wrangler.toml"
      - ".github/workflows/deploy-cloudflare-pages.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Pages advanced-mode Worker
        run: node scripts/build-pages-worker.mjs

      - name: Check JavaScript syntax
        run: |
          for file in public/*.js; do
            node --check "$file"
          done
          node --input-type=module --check < public/_worker.js
          node --check cloudflare-worker/worker.js
          node --check "functions/[[path]].js"

      - name: Deploy Pages site and Functions
        run: npx --yes wrangler pages deploy public --project-name mudarris-join --branch main --skip-caching
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 9e739c95393369e7dbe6bc2cac5899b1

      - name: Deploy standalone API Worker
        run: npx --yes wrangler deploy --config cloudflare-worker/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 9e739c95393369e7dbe6bc2cac5899b1
