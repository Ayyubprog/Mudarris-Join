<!doctype html>
<html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MUDARRIS JOIN — Birgalikda o‘ynang</title><link rel="stylesheet" href="/theme.css"><meta name="theme-color" content="#46178f"></head>
<body class="game-bg student-join" style="min-height:100vh;color:white">
<header class="join-header" style="height:76px;padding:0 clamp(18px,5vw,70px);display:flex;align-items:center;justify-content:space-between">
  <a class="brand" href="/" style="font-size:22px"><span class="brand-mark">M</span><span>MUDARRIS JOIN</span></a>
  <a href="/login" class="btn" style="background:#ffffff18;color:white;border:1px solid #ffffff40">O‘qituvchi kirishi ↗</a>
</header>
<main class="join-main" style="min-height:calc(100vh - 76px);display:grid;place-items:center;padding:30px 18px 70px">
  <section class="join-panel" style="width:min(510px,100%);text-align:center">
    <div class="join-emoji" style="font-size:56px;margin-bottom:12px;filter:drop-shadow(0 8px 14px #1d073d66)">🎮</div>
    <div class="eyebrow join-eyebrow" style="color:#d9c5f4;margin-bottom:10px">MUDARRIS SINF O‘YINLARI</div>
    <h1 class="display join-title" style="font-size:clamp(42px,8vw,68px);line-height:.98;margin:0 0 14px;color:#fff">Qani, o‘ynaymiz!</h1>
    <p class="join-subtitle" style="color:#e5d8f5;font-size:17px;margin:0 0 28px">O‘qituvchingiz bergan o‘yin PIN-kodini kiriting.</p>
    <form id="join-form" class="card join-card" style="padding:24px;text-align:left">
      <label for="pin" class="eyebrow" style="display:block;margin-bottom:9px">O‘yin PIN-kodi</label>
      <input id="pin" class="field" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="O‘yin PIN-kodini kiriting" required style="font-size:21px;font-weight:900;letter-spacing:.12em;text-align:center">
      <button class="btn btn-primary" type="submit" style="width:100%;margin-top:14px;height:54px;font-size:17px">O‘YINGA KIRISH <span>→</span></button>
      <p id="join-error" class="muted" style="font-size:13px;text-align:center;min-height:18px;margin:12px 0 0"></p>
    </form>
    <div class="join-hints" style="display:flex;justify-content:center;gap:18px;margin-top:25px;color:#e4d8f1;font-size:13px;font-weight:700"><span>⚡ O‘quvchi akkaunti kerak emas</span><span>✦ Kodni kiriting va o‘ynang</span></div>
  </section>
</main>
<script>
document.getElementById('join-form').addEventListener('submit',e=>{e.preventDefault();const pin=document.getElementById('pin').value.trim();const err=document.getElementById('join-error');if(!/^\d{6}$/.test(pin)){err.textContent='Iltimos, 6 xonali o‘yin PIN-kodini kiriting.';return}location.href='/play.html?pin='+encodeURIComponent(pin)});
</script></body></html>
