<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>O‘yinga qo‘shilish — MUDARRIS JOIN</title><link rel="icon" type="image/svg+xml" href="/mudarris-book-purple.svg"><link rel="stylesheet" href="/theme.css"><style>.join-card{width:min(580px,100%);padding:clamp(24px,5vw,42px);text-align:center;color:var(--ink)}.join-card h1{font-size:34px;margin:10px 0}.join-card p{line-height:1.6}.avatar-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:9px}.avatar{width:100%;height:54px;font-size:28px}.player-big{font-size:58px;margin:10px 0 20px}.waiting-pulse{display:flex;justify-content:center;gap:8px;margin:28px}.waiting-pulse i{width:10px;height:10px;border-radius:50%;background:#8052bb;animation:bounce .8s infinite alternate}.waiting-pulse i:nth-child(2){animation-delay:.2s}.waiting-pulse i:nth-child(3){animation-delay:.4s}@keyframes bounce{to{transform:translateY(-9px);opacity:.4}}.question-wrap{width:min(1000px,100%);margin:0 auto}.question-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px;color:white}.question-card{padding:clamp(22px,4vw,42px);text-align:center}.question-card h1{font-size:clamp(26px,4vw,42px);line-height:1.15;margin:14px 0 22px}.question-timer{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:20px}.question-timer>div{width:190px;height:8px;border-radius:99px;background:#eee8f5;overflow:hidden}.question-timer i{display:block;height:100%;width:100%;background:#279a77}.answer-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.answer-status{margin-top:17px;font-weight:900;min-height:22px}.typed-answer{display:flex;gap:10px;grid-column:1/-1}.typed-answer input{flex:1}.race-board{margin-top:22px;text-align:left;border-top:1px solid var(--line);padding-top:15px}.race-row{display:grid;grid-template-columns:90px 1fr 55px;align-items:center;gap:10px;margin:9px 0;font-size:12px}.race-row>div{height:8px;
