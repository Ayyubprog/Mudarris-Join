<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jonli viktorina — MUDARRIS JOIN</title>
<link rel="icon" type="image/svg+xml" href="/mudarris-book-purple.svg">
<link rel="stylesheet" href="/theme.css">
<meta name="theme-color" content="#25113f">
<style>
:root{--live-bg:#211039;--live-purple:#6130a0;--live-ink:#291a3d;--live-muted:#857991;--live-line:#eee8f4;--live-white:#fff;--live-green:#20a36d}
*{box-sizing:border-box}
body.live-host{margin:0;min-height:100vh;background:radial-gradient(ellipse at 10% -10%,#56308a 0,transparent 38%),radial-gradient(ellipse at 100% 0,#39205e 0,transparent 35%),var(--live-bg);color:#fff;font-family:Nunito,system-ui,sans-serif}
.live-header{position:sticky;top:0;z-index:20;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;padding:12px clamp(14px,3vw,38px);background:#1a0c2feF;border-bottom:1px solid #ffffff1f;backdrop-filter:blur(16px)}
.live-brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;font-size:14px;font-weight:1000;letter-spacing:-.03em}
.live-brand-mark{width:36px;height:36px;padding:3px;border-radius:10px;background:#fff}
.live-brand-mark img{width:100%;height:100%;object-fit:contain}
.live-brand b{color:#cda9ff}
.live-title-wrap{min-width:0;text-align:center}
.live-title{max-width:42vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;font-weight:900}
.live-mode{margin-top:3px;color:#c6b5d8;font-size:9px;font-weight:800;letter-spacing:.12em}
.live-header-actions{display:flex;align-items:center;justify-content:flex-end;gap:8px}
.live-header-button{height:36px;padding:0 12px;border:1px solid #ffffff35;border-radius:9px;background:#ffffff12;color:#fff;font:900 10px Nunito,system-ui;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:7px}
.live-header-button:hover{background:#ffffff22}
.live-pin-pill{display:flex;align-items:center;gap:10px;padding:7px 14px;border:1px solid #ffffff35;border-radius:12px;background:#ffffff12}
.live-pin-label{color:#c9b9d9;font-size:8px;font-weight:1000;letter-spacing:.15em}
.live-pin-number{font-size:21px;font-weight:1000;letter-spacing:.18em;font-variant-numeric:tabular-nums}
.live-main{width:min(1500px,100%);margin:0 auto;padding:clamp(14px,2.4vw,32px) clamp(13px,3vw,38px) 28px}
.live-stage{min-height:calc(100vh - 125px);display:flex;flex-direction:column;gap:18px}
.live-lobby{flex:1;display:grid;grid-template-columns:minmax(0,1.08fr) minmax(330px,.92fr);gap:18px;min-height:540px}
.live-panel{background:#fff;color:var(--live-ink);border:1px solid #ffffff88;border-radius:20px;box-shadow:0 18px 55px #10071e55}
.live-invite-panel{display:flex;flex-direction:column;justify-content:center;padding:clamp(24px,4.5vw,62px);overflow:hidden;position:relative}
.live-invite-panel:after{content:"";position:absolute;right:-110px;top:-130px;width:300px;height:300px;border:40px solid #f2eafa;border-radius:50%;pointer-events:none}
.live-kicker{color:#7a4caf;font-size:10px;font-weight:1000;letter-spacing:.2em}
.live-lobby-title{max-width:640px;margin:13px 0 10px;color:#261238;font-size:clamp(30px,4.5vw,56px);line-height:1.02;font-weight:1000;letter-spacing:-.055em}
.live-lobby-copy{max-width:550px;margin:0;color:#80738d;font-size:clamp(12px,1.2vw,15px);line-height:1.7}
.live-pin-block{position:relative;z-index:1;margin:28px 0 20px;padding:17px 22px;border:2px dashed #d6c6e9;border-radius:17px;background:#fbf8ff}
.live-pin-caption{color:#927da8;font-size:9px;font-weight:1000;letter-spacing:.18em}
.live-big-pin{margin-top:3px;color:#57248e;font-size:clamp(52px,8.5vw,96px);line-height:1.12;font-weight:1000;letter-spacing:.16em;font-variant-numeric:tabular-nums}
.live-join-url{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:3px;color:#6e5b82;font-size:12px;font-weight:800}
.live-join-url strong{color:#3e2855}
.live-pin-copy{padding:7px 10px;border:0;border-radius:8px;background:#eee5f8;color:#5b2b92;font-size:9px;font-weight:1000;cursor:pointer}
.live-invite-tip{display:flex;align-items:center;gap:10px;margin-top:18px;color:#8b8098;font-size:10px;font-weight:800}
.live-invite-tip i{width:8px;height:8px;border-radius:50%;background:#2bb47c;box-shadow:0 0 0 5px #e1f7eb}
.live-players-panel{display:flex;flex-direction:column;padding:clamp(20px,3vw,34px);min-height:0}
.live-players-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:15px}
.live-players-head h2{margin:0;color:#2a1a3c;font-size:20px;font-weight:1000;letter-spacing:-.03em}
.live-count{display:inline-flex;align-items:center;gap:7px;padding:8px 11px;border-radius:999px;background:#f1eafa;color:#64369a;font-size:11px;font-weight:1000}
.live-count i{width:7px;height:7px;border-radius:50%;background:#27ad78}
.live-player-wall{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;align-content:start;overflow:auto;max-height:470px;padding:2px}
.live-player-chip{display:flex;align-items:center;gap:9px;min-width:0;padding:10px 11px;border:1px solid #eee8f4;border-radius:11px;background:#fcfbfe;animation:playerPop .25s ease-out}
.live-player-avatar{width:36px;height:36px;flex:none;display:grid;place-items:center;border-radius:10px;background:#f0e7fb;font-size:22px}
.live-player-chip strong{min-width:0;overflow:hidden;color:#3b2a4c;font-size:11px;font-weight:1000;text-overflow:ellipsis;white-space:nowrap}
.live-player-empty{grid-column:1/-1;display:grid;place-items:center;min-height:260px;padding:24px;border:1.5px dashed #e5dced;border-radius:14px;color:#9588a2;text-align:center}
.live-player-empty span{display:block;margin-bottom:10px;font-size:38px}
.live-player-empty strong{color:#60427d;font-size:14px}
.live-player-empty small{max-width:230px;margin-top:6px;font-size:10px;line-height:1.6}
.live-stage-footer{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:16px 18px;border:1px solid #ffffff22;border-radius:16px;background:#ffffff0d}
.live-stage-hint{color:#d9cce7;font-size:11px;line-height:1.55}
.live-stage-hint strong{color:#fff}
.live-controls{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.live-control-button{min-height:44px;padding:0 17px;border:0;border-radius:10px;font:1000 12px Nunito,system-ui;cursor:pointer;transition:transform .16s,filter .16s,opacity .16s}
.live-control-button:hover:not(:disabled){transform:translateY(-2px);filter:brightness(1.04)}
.live-control-button:disabled{opacity:.42;cursor:not-allowed}
.live-primary{background:#26b87e;color:#fff;box-shadow:0 4px 0 #168456}
.live-secondary{background:#fff;color:#543078}
.live-danger{background:#ffe9ec;color:#b43f58}
.live-question-shell{flex:1;display:flex;flex-direction:column;gap:15px}
.live-question-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.live-progress-copy{color:#e1d5ee;font-size:10px;font-weight:1000;letter-spacing:.15em}
.live-timer{display:flex;align-items:center;gap:10px;min-width:200px}
.live-timer-number{width:48px;color:#fff;font-size:24px;font-weight:1000;text-align:center;font-variant-numeric:tabular-nums}
.live-timer-track{height:9px;flex:1;overflow:hidden;border-radius:99px;background:#ffffff32}
.live-timer-fill{height:100%;width:100%;border-radius:inherit;background:#f7c94c;transition:width .12s linear}
.live-question-card{flex:1;display:flex;flex-direction:column;justify-content:center;padding:clamp(20px,3vw,40px);border-radius:19px;background:#fff;color:#2a1b3b;box-shadow:0 18px 55px #10071e55;text-align:center}
.live-question-index{color:#8555b6;font-size:10px;font-weight:1000;letter-spacing:.18em}
.live-question-prompt{max-width:1050px;margin:12px auto 18px;font-size:clamp(27px,4.3vw,54px);line-height:1.08;font-weight:1000;letter-spacing:-.045em}
.live-question-media{display:flex;justify-content:center;max-height:270px;margin:0 auto 17px}
.live-question-media img,.live-question-media video{max-width:100%;max-height:260px;object-fit:contain;border-radius:12px}
.live-question-media iframe{width:min(100%,660px);aspect-ratio:16/9;border:0;border-radius:12px}
.live-answer-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;max-width:1100px;width:100%;margin:10px auto 0}
.live-answer-tile{display:flex;align-items:center;gap:15px;min-height:105px;padding:16px 20px;border:4px solid transparent;border-radius:14px;color:#fff;text-align:left;box-shadow:0 5px 0 #170d23aa;position:relative}
.live-answer-tile .shape{width:38px;flex:none;font-size:27px;text-align:center}
.live-answer-tile strong{font-size:clamp(14px,2vw,22px);font-weight:1000;line-height:1.25;overflow-wrap:anywhere}
.live-answer-red{background:#e34c5b}.live-answer-blue{background:#3477d4}.live-answer-yellow{background:#e4ad2f;color:#39290d}.live-answer-green{background:#239b70}
.live-answer-tile.is-correct{border-color:#fff;box-shadow:0 0 0 4px #25a66f,0 5px 0 #0d5f43}
.live-answer-check{margin-left:auto;font-size:23px;font-weight:1000}
.live-question-note{margin-top:16px;color:#9789a6;font-size:10px;font-weight:800}
.live-reveal-banner{display:flex;align-items:center;justify-content:center;gap:9px;margin:0 auto 14px;padding:9px 14px;border-radius:999px;background:#e6f8ef;color:#208356;font-size:10px;font-weight:1000}
.live-question-stats{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin:10px 0 0}
.live-stat-pill{padding:8px 11px;border-radius:999px;background:#f2edf7;color:#675379;font-size:9px;font-weight:1000}
.live-free-responses{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;max-width:1000px;width:100%;margin:14px auto 0}
.live-free-response{padding:12px;border:1px solid #eee7f4;border-radius:10px;background:#fcfaff;text-align:left}
.live-free-response strong{color:#65389a;font-size:10px}
.live-free-response p{margin:5px 0 0;color:#43344f;font-size:12px;line-height:1.5;overflow-wrap:anywhere;white-space:pre-wrap}
.live-finish-card{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:35px 20px;border-radius:20px;background:#fff;color:#2c1c3e;text-align:center}
.live-finish-trophy{font-size:65px}
.live-finish-title{margin:10px 0;color:#2c1a41;font-size:clamp(30px,5vw,54px);font-weight:1000;letter-spacing:-.05em}
.live-podium{display:flex;align-items:flex-end;justify-content:center;gap:10px;width:min(700px,100%);margin:22px auto}
.live-podium-item{flex:1;max-width:190px;min-width:0;padding:15px 10px;border-radius:13px 13px 6px 6px;background:#f4eff9;color:#4a345f}
.live-podium-item.first{min-height:150px;background:#fff2ce;color:#6d4b0d}
.live-podium-item.second{min-height:118px}.live-podium-item.third{min-height:95px}
.live-podium-item span{display:block;font-size:25px}
.live-podium-item strong{display:block;overflow:hidden;margin:7px 0 3px;font-size:12px;text-overflow:ellipsis;white-space:nowrap}
.live-podium-item small{font-size:10px;font-weight:900}
.live-error{padding:28px;border:1px solid #ffffff25;border-radius:15px;background:#ffffff12;color:#fff;line-height:1.6}
.live-error a{color:#e6d2ff}
@keyframes playerPop{from{opacity:0;transform:scale(.94) translateY(5px)}to{opacity:1;transform:scale(1) translateY(0)}}
@media(max-width:850px){.live-header{grid-template-columns:1fr auto}.live-title-wrap{display:none}.live-lobby{grid-template-columns:1fr;min-height:0}.live-players-panel{min-height:260px}.live-player-wall{max-height:310px}.live-stage{min-height:0}.live-invite-panel{min-height:420px}.live-question-card{min-height:calc(100vh - 250px)}}
@media(max-width:570px){.live-header{padding:9px 11px;gap:7px}.live-brand{font-size:11px;gap:7px}.live-brand-mark{width:29px;height:29px}.live-header-actions{gap:5px}.live-header-button{height:32px;padding:0 8px;font-size:8px}.live-pin-pill{gap:5px;padding:5px 8px}.live-pin-label{font-size:6px}.live-pin-number{font-size:15px;letter-spacing:.12em}.live-main{padding:12px 10px 22px}.live-lobby{gap:10px}.live-invite-panel,.live-players-panel{padding:20px 16px;border-radius:15px}.live-invite-panel{min-height:360px}.live-lobby-title{font-size:34px}.live-big-pin{font-size:58px;letter-spacing:.12em}.live-player-wall{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}.live-player-chip{padding:7px;gap:6px}.live-player-avatar{width:29px;height:29px;font-size:18px}.live-player-chip strong{font-size:9px}.live-stage-footer{align-items:stretch;padding:12px;gap:10px}.live-stage-hint{font-size:9px}.live-controls{width:100%}.live-control-button{flex:1;min-height:42px;padding:0 9px;font-size:10px}.live-question-card{padding:17px 11px;border-radius:14px;min-height:calc(100vh - 185px)}.live-question-prompt{font-size:28px}.live-answer-grid{gap:7px}.live-answer-tile{min-height:90px;padding:10px 8px;border-radius:9px;gap:7px}.live-answer-tile .shape{width:23px;font-size:18px}.live-answer-tile strong{font-size:12px}.live-question-top{gap:7px}.live-timer{min-width:140px}.live-timer-number{width:35px;font-size:19px}.live-podium{gap:5px}.live-podium-item{padding:11px 5px}.live-podium-item strong{font-size:9px}}
</style>
